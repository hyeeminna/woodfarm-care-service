<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WOODFARM CARE 반응형 레이아웃 테스트</title>
  <style>
    /* CSS 변수 (포인트 컬러) */
    :root {
      --color-primary: #6c5ce7;
      --color-primary-dark: #5a4fcf;
      --color-primary-light: #f8f7ff;
      --color-text-primary: #2c3e50;
      --color-text-secondary: #6c757d;
      --color-border: #e9ecef;
      --color-border-hover: #adb5bd;
      --color-background: #f8f9fa;
      --color-white: #ffffff;
      --color-success: #28a745;
      --color-error: #dc3545;
      --color-warning: #ffc107;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Noto Sans KR', sans-serif;
      line-height: 1.6;
      color: var(--color-text-primary);
      background-color: var(--color-background);
    }

    /* 기본 컨테이너 - 모바일 우선 (360px+) */
    .care-container {
      width: 100%;
      max-width: 100vw;
      margin: 0 auto;
      padding: 0 16px;
      min-width: 360px; /* 최소 지원 width */
    }

    /* 콘텐츠 컨테이너 */
    .care-content {
      width: 100%;
      max-width: 100%;
      margin: 0 auto;
    }

    /* 768px 이상: 콘텐츠 최대폭 제한 및 수평 중앙 정렬 */
    @media (min-width: 768px) {
      .care-content {
        max-width: 960px; /* 720px~960px 범위 내 */
        padding: 0 32px;
      }
    }

    @media (min-width: 1024px) {
      .care-content {
        max-width: 720px; /* 데스크톱에서는 좀 더 좁게 */
        padding: 0 24px;
      }
    }

    /* 카드 그리드 시스템 */
    .care-card-grid {
      display: grid;
      gap: 16px;
      width: 100%;
      grid-template-columns: 1fr; /* 모바일 기본: 1열 */
    }

    /* 중간 모바일 (480-767px): 2열 가능 */
    @media (min-width: 480px) and (max-width: 767px) {
      .care-card-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 16px;
      }
    }

    /* 태블릿 이상 (768px+): 2열 또는 auto-fit */
    @media (min-width: 768px) {
      .care-card-grid {
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 20px;
      }
    }

    /* 기본 카드 스타일 */
    .care-card {
      background: var(--color-white);
      border: 2px solid var(--color-border);
      border-radius: 12px;
      padding: 20px;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
      min-height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .care-card:hover {
      border-color: var(--color-border-hover);
      background-color: var(--color-background);
    }

    .care-card--selected {
      border-color: var(--color-primary);
      background-color: var(--color-primary-light);
      box-shadow: 0 2px 8px rgba(108, 92, 231, 0.15);
    }

    /* 체크 아이콘 */
    .care-check-icon {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background-color: var(--color-primary);
      color: var(--color-white);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: bold;
    }

    /* 타이포그래피 */
    .care-title {
      font-size: 20px;
      font-weight: 600;
      color: var(--color-text-primary);
      margin: 0 0 8px 0;
      text-align: center;
    }

    .care-subtitle {
      font-size: 14px;
      color: var(--color-text-secondary);
      margin: 0 0 32px 0;
      text-align: center;
    }

    .care-card-label {
      font-size: 16px;
      font-weight: 500;
      color: var(--color-text-secondary);
      pointer-events: none;
      user-select: none;
    }

    .care-card-label--selected {
      color: var(--color-primary);
      font-weight: 600;
    }

    /* 하단 고정 버튼 시스템 */
    .care-bottom-fixed {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--color-white);
      border-top: 1px solid var(--color-border);
      padding: 16px 20px;
      box-shadow: 0 -2px 12px rgba(0, 0, 0, 0.08);
      z-index: 1000;
    }

    /* 데스크톱에서는 하단 고정 해제 */
    @media (min-width: 768px) {
      .care-bottom-fixed {
        position: static;
        background: transparent;
        border-top: none;
        padding: 24px 0;
        box-shadow: none;
      }
    }

    /* 버튼 스타일 */
    .care-btn {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      line-height: 1.4;
    }

    .care-btn--primary {
      background: var(--color-primary);
      color: var(--color-white);
    }

    .care-btn--primary:hover {
      background: var(--color-primary-dark);
      transform: translateY(-1px);
    }

    .demo-controls {
      padding: 20px;
      text-align: center;
      background: white;
      margin-bottom: 20px;
    }

    .viewport-info {
      margin: 10px 0;
      font-family: monospace;
      background: #f0f0f0;
      padding: 10px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="demo-controls">
    <h1>WOODFARM CARE 반응형 레이아웃 테스트</h1>
    <div class="viewport-info">
      현재 화면 폭: <span id="viewport-width"></span>px
    </div>
    <p>브라우저 창 크기를 조절해서 반응형 동작을 확인하세요.</p>
  </div>

  <div class="care-container">
    <div class="care-content">
      <h2 class="care-title">공간의 상주 인원은 몇 명인가요?</h2>
      <p class="care-subtitle">해당하는 규모를 선택해주세요</p>

      <div class="care-card-grid">
        <div class="care-card">
          <div class="care-check-icon">✓</div>
          <span class="care-card-label care-card-label--selected">10인 이하</span>
        </div>
        <div class="care-card care-card--selected">
          <span class="care-card-label">11~30인</span>
        </div>
        <div class="care-card">
          <span class="care-card-label">31~50인</span>
        </div>
        <div class="care-card">
          <span class="care-card-label">50인 이상</span>
        </div>
      </div>
    </div>
  </div>

  <div class="care-bottom-fixed">
    <button class="care-btn care-btn--primary">다음</button>
  </div>

  <script>
    function updateViewportWidth() {
      document.getElementById('viewport-width').textContent = window.innerWidth;
    }
    
    window.addEventListener('resize', updateViewportWidth);
    updateViewportWidth();
  </script>
</body>
</html>
